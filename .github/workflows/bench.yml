name: Benchmarks

# The mirror suite (frame gaps and layout reads) and the draw-call bench, run
# on a pull request against develop and reported in a comment on it.
#
# Started by hand, never by a push: a full run takes the best part of an hour
# of runner time, and a stack of pull requests takes many pushes. Adding the
# `bench` label to a pull request starts one run, and the run takes the label
# off again when it ends, so adding it again is how to run it again. Only
# someone with write access can add a label, which is what keeps a pull
# request from a fork from starting one.
#
# Always against develop, never against the pull request's own base: in a
# stack, the base is the pull request below, and the question worth an hour
# is what the stack up to here does to develop, not what its last step did.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Mirror scenarios, comma separated (all six when empty)"
        type: string
        default: ""
      repeat:
        description: "Rounds a side, interleaved"
        type: number
        default: 3

# Adding the label again while a run is going restarts it on the newest head.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  bench:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'bench'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      # To post the comment and take the label off. Labels on a pull request
      # are written through the issues API.
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull request's head, not the merge commit GitHub makes with
          # its base: develop is what it is compared with, and the base may
          # be another branch of the stack.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # develop has to be in the checkout, for its own run of the draw
          # bench and for the mirror suite's worktree.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Name the two sides
        id: sides
        # Where both benches write, for the report and the artifact. Set here
        # because a job's own `env` cannot read the runner context.
        run: |
          echo "OUT=$RUNNER_TEMP/bench" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/bench"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "base=$(git rev-parse origin/develop)" >> "$GITHUB_OUTPUT"
      # As in visual.yml and driven.yml, and under the same key: the lockfile
      # pins playwright, and playwright pins the browser.
      - name: Cache the browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{
            hashFiles('./common/config/rush/pnpm-lock.yaml') }}

      # develop first, from a checkout of its own. The draw bench measures the
      # tree it sits in and has no A/B of its own; its counts do not vary run
      # to run, so measuring the two sides one after the other loses nothing.
      - name: Check out develop
        run: git checkout --detach ${{ steps.sides.outputs.base }}
      - name: Rush install (develop)
        run: node common/scripts/install-run-rush.js install
      - name: Install Chromium
        run: node packages/xr/node_modules/playwright-core/cli.js install --with-deps chromium
      # The draw bench launches through justdom-xr's driver, which takes the
      # browser from CHROMIUM, as in driven.yml.
      - name: Point the draw bench at it
        run: |
          echo "CHROMIUM=$(node --input-type=module -e "
            const { chromium } = await import('./packages/xr/node_modules/playwright-core/index.mjs');
            console.log(chromium.executablePath());
          ")" >> "$GITHUB_ENV"
      - name: Count draw calls (develop)
        id: draws-base
        continue-on-error: true
        run: |
          set -o pipefail
          node packages/three/bench/paintOrderDraws.browser.mjs | tee "$OUT/draws-develop.md"

      - name: Check out the pull request
        run: git checkout --detach ${{ steps.sides.outputs.head }}
      - name: Rush install (pull request)
        run: node common/scripts/install-run-rush.js install
      - name: Count draw calls (pull request)
        id: draws-head
        continue-on-error: true
        run: |
          set -o pipefail
          node packages/three/bench/paintOrderDraws.browser.mjs | tee "$OUT/draws-head.md"
      # Both sides in one process, interleaved round by round, so that a
      # runner getting busier drifts through both alike. develop's side runs
      # from a worktree at the commit named above, not from `origin/develop`,
      # so both benches measure the same develop even if it moves meanwhile.
      - name: Measure layout reads and frame gaps
        id: mirror
        continue-on-error: true
        working-directory: apps/showcase
        env:
          SCENARIOS: ${{ inputs.scenarios }}
          REPEAT: ${{ inputs.repeat || 3 }}
        run: |
          set -o pipefail
          args=(--against "${{ steps.sides.outputs.base }}" --repeat "$REPEAT" --json "$OUT/mirror.json")
          if [ -n "$SCENARIOS" ]; then
            args+=(--scenario "$SCENARIOS")
          fi
          node bench/run.js "${args[@]}" | tee "$OUT/mirror.txt"

      - name: Write the report
        if: ${{ !cancelled() }}
        run: |
          node apps/showcase/bench/report.js \
            --mirror "$OUT/mirror.json" \
            --draws-base "$OUT/draws-develop.md" \
            --draws-head "$OUT/draws-head.md" \
            --base ${{ steps.sides.outputs.base }} \
            --head ${{ steps.sides.outputs.head }} > "$OUT/report.md"
          cat "$OUT/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload what it measured
        id: artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bench
          path: ${{ runner.temp }}/bench
          if-no-files-found: warn
          retention-days: 30
      # One comment per pull request, rewritten by every run, so the comment
      # always describes the newest one.
      - name: Post the report on the pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        # A courtesy, as in visual.yml: the job summary and the artifact hold
        # the same report if the token cannot write here.
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("node:fs");
            const MARKER = "<!-- benchmarks -->";
            const report = fs.readFileSync(`${process.env.OUT}/report.md`, "utf8");
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifact = ${{ toJSON(steps.artifact.outputs['artifact-url']) }};
            const body = [
              MARKER,
              report,
              `<sub>[Run](${run})` +
                (artifact ? ` · [everything it printed and wrote](${artifact})` : "") +
                " · add the `bench` label again to measure the newest push.</sub>",
            ].join("\n\n");
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      # Even after a failure, so that the label on a pull request means a run
      # is going. Not after a cancel: the label added again is what cancels
      # a run, and the run it starts takes the label off when it ends.
      - name: Take the label off
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.removeLabel({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              name: "bench",
            });
      - name: Fail if a bench did not finish
        if: >-
          steps.draws-base.outcome == 'failure'
          || steps.draws-head.outcome == 'failure'
          || steps.mirror.outcome == 'failure'
        run: |
          echo "draw calls on develop: ${{ steps.draws-base.outcome }}"
          echo "draw calls on the pull request: ${{ steps.draws-head.outcome }}"
          echo "mirror suite: ${{ steps.mirror.outcome }}"
          exit 1
